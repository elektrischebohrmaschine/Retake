<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Car Sharing - Registrieren</title>
</head>
<body>
<h1>Registrieren</h1>
<p th:if="${error}" th:text="${error}" style="color:red"></p>
<form th:action="@{/register}" th:object="${newUser}" method="post">
    <label>Vorname <input type="text" th:field="*{firstname}" required></label><br>
    <label>Nachname <input type="text" th:field="*{lastname}" required></label><br>
    <label>Alter <input type="number" th:field="*{age}" required></label><br>
    <label>Username <input type="text" th:field="*{username}" required></label><br>
    <label>Passwort <input type="password" th:field="*{password}" required></label><br>
    <label>Kreditkarte <input type="text" th:field="*{creditCardNr}" required></label><br>
    <label>Führerschein <input type="text" th:field="*{driversLicenceNr}" required></label><br>
    <button type="submit">Registrieren</button>
</form>
<a th:href="@{/}">Zurück zum Login</a>
</body>
</html>
